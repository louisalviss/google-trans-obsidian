name: Release Obsidian Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create or update release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v0.3.0
          name: v0.3.0
          body: |
            Google Trans Obsidian v0.3.0

            Changes:
            - Visible loading overlay on mobile/desktop
            - Faster translation with larger chunks
            - Parallel translation requests
            - Progress bar with request counter
            - Retry with backoff
            - Translation log modal
            - Markdown protection retained
          files: |
            manifest.json
            main.js
            versions.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
