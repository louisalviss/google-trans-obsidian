name: Privacy scrub public commit metadata

on:
  push:

permissions:
  contents: write

concurrency:
  group: privacy-scrub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrub:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Rewrite exposed push identity to bot noreply
        shell: bash
        env:
          TARGET_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          TARGET_COMMITTER_EMAIL: ${{ github.event.head_commit.committer.email }}
          NEW_NAME: github-actions[bot]
          NEW_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          export TARGET_AUTHOR_EMAIL TARGET_COMMITTER_EMAIL NEW_NAME NEW_EMAIL
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --env-filter '
            case "$TARGET_AUTHOR_EMAIL" in
              ""|*@users.noreply.github.com|noreply@github.com) ;;
              *)
                if [ "$GIT_AUTHOR_EMAIL" = "$TARGET_AUTHOR_EMAIL" ]; then
                  export GIT_AUTHOR_NAME="$NEW_NAME"
                  export GIT_AUTHOR_EMAIL="$NEW_EMAIL"
                fi
                ;;
            esac
            case "$TARGET_COMMITTER_EMAIL" in
              ""|*@users.noreply.github.com|noreply@github.com) ;;
              *)
                if [ "$GIT_COMMITTER_EMAIL" = "$TARGET_COMMITTER_EMAIL" ]; then
                  export GIT_COMMITTER_NAME="$NEW_NAME"
                  export GIT_COMMITTER_EMAIL="$NEW_EMAIL"
                fi
                ;;
            esac
          ' HEAD
          git push --force origin HEAD:${GITHUB_REF_NAME}
