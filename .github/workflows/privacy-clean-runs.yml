name: Privacy cleanup workflow metadata

on:
  workflow_run:
    workflows: ["Privacy scrub public commit metadata"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete runs exposing non-noreply commit email
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[]
              | select(.head_commit != null)
              | select(
                  (((.head_commit.author.email // "") != "") and (((.head_commit.author.email // "") | endswith("@users.noreply.github.com")) | not) and ((.head_commit.author.email // "") != "noreply@github.com"))
                  or
                  (((.head_commit.committer.email // "") != "") and (((.head_commit.committer.email // "") | endswith("@users.noreply.github.com")) | not) and ((.head_commit.committer.email // "") != "noreply@github.com"))
                )
              | .id')"
          for id in $ids; do
            [ -z "$id" ] && continue
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.status' 2>/dev/null || true)"
            if [ -n "$status" ] && [ "$status" != "completed" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null 2>&1 || true
            fi
          done
          sleep 2
          for id in $ids; do
            [ -z "$id" ] && continue
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null 2>&1 || true
          done
